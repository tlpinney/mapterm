# OSV-Scanner (CI's "Vulnerabilities (OSV)" job). Each ignore says why and expires, so it is
# looked at again rather than left forever.
#
# zstd 0.13.4 / zstd-safe 7.4.0 (via parquet 59, which allows no zstd 0.14) carry backports
# of all of these, one commit each on zstd-rs's 0.13.x branch, released 2026-11-01. The
# advisory databases list only zstd 0.14.3+ / zstd-safe 8.2.0+ as fixed so far. Remove these
# when they record the backports, or when geoparquet moves to parquet 60 (zstd 0.14).

