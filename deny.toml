# cargo-deny: known vulnerabilities, licenses, duplicate crates and where crates come from.
# CI runs `cargo deny check` on every push and pull request, and nightly for new advisories.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the platforms mapterm is built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories: vulnerabilities fail; unmaintained crates and yanked versions are
# reported too.
yanked = "deny"
ignore = [
    # zstd 0.13.4 and zstd-safe 7.4.0 (2026-11-01, via parquet 59, which allows no zstd 0.14)
    # carry backports of these three fixes: a reused context starts a new frame, seekable
    # decompression checks its length, and legacy-frame streaming no longer exposes
    # uninitialized memory (checked by diffing them against 0.13.3 / 7.3.0). The advisory
    # database lists only zstd 0.14.3+ / zstd-safe 8.2.0+ as fixed so far. Remove these when
    # it records the backports, or when geoparquet moves to parquet 60 (zstd 0.14).
    { id = "RUSTSEC-2026-0391", reason = "fixed by backport in zstd 0.13.4; database not yet updated" },
    { id = "RUSTSEC-2026-0398", reason = "fixed by backport in zstd-safe 7.4.0; database not yet updated" },
    { id = "RUSTSEC-2026-0403", reason = "fixed by backport in zstd-safe 7.4.0; database not yet updated" },
]

[licenses]
# Every dependency must be usable in an MIT-licensed crate: only these licenses are
# accepted (for "A OR B", one of them is enough).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of the same crate are reported, not fatal (common in Rust trees).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates only from crates.io; no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
