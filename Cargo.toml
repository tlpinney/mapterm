[package]
name = "mapterm"
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds it (the uuid dependency needs 1.89; mapterm itself 1.88).
rust-version = "1.89"
description = "A map in your terminal: vector tiles, MapLibre styles, imagery and your own data, as a ratatui widget and the mapterm viewer"
license = "MIT"
authors = ["Travis Pinney <travis.pinney@gmail.com>"]
repository = "https://github.com/tlpinney/mapterm"
readme = "README.md"
keywords = ["map", "terminal", "tui", "ratatui", "maplibre"]
categories = ["command-line-utilities", "science::geo", "visualization"]
# Kept out of the package: CI and release tooling, and the integration tests with their
# fixtures (they live in the repository).
exclude = [".github/", "tests/", "deny.toml", "release/", "signing/", "fuzz/"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
flate2 = "1.1.10"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"

[[bin]]
name = "mapterm"
path = "src/bin/mapterm.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
