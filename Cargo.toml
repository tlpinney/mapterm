[package]
name = "termtiles"
version = "0.1.0"
edition = "2024"
description = "Vector map tiles (PMTiles or XYZ MVT) rendered in the terminal as a ratatui widget"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
flate2 = "1.1.10"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"

[[bin]]
name = "tmap"
path = "src/bin/tmap.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
