[package]
name = "mapterm"
version = "0.1.0"
edition = "2024"
description = "A map in your terminal: vector tiles (PMTiles, OpenFreeMap) as a ratatui widget, plus the mapterm viewer"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
flate2 = "1.1.10"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"

[[bin]]
name = "mapterm"
path = "src/bin/mapterm.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
