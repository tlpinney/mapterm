[package]
name = "mapterm"
version = "0.4.0"
edition = "2024"
# The oldest Rust that builds it (geoparquet and geoarrow-array 0.10 need 1.95).
rust-version = "1.95"
description = "A map in your terminal: vector tiles, MapLibre styles, imagery and your own data, as a ratatui widget and the mapterm viewer"
license = "MIT"
authors = ["Travis Pinney <travis.pinney@gmail.com>"]
repository = "https://github.com/tlpinney/mapterm"
homepage = "https://mapterm.com"
documentation = "https://docs.rs/mapterm"
readme = "README.md"
keywords = ["map", "terminal", "tui", "ratatui", "maplibre"]
categories = ["command-line-utilities", "science::geo", "visualization"]
# Kept out of the package: CI and release tooling, and the integration tests with their
# fixtures (they live in the repository).
exclude = [".github/", "tests/", "deny.toml", "about.toml", "about.hbs", "release/", "signing/", "fuzz/", "assets/"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1"
arrow-cast = { version = "60.1", default-features = false }
arrow-schema = "60.1"
bytes = "1.12"
crossterm = "0.29.0"
flate2 = "1.1.10"
futures = "0.3"
geo-traits = "0.3"
geo-types = "0.7"
geoarrow-array = "0.10"
geoparquet = { version = "0.10", features = ["async"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
parquet = { version = "60.2", default-features = false, features = ["arrow", "async", "snap", "zstd"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls-native-certs = "0.8"
serde_json = "1.0.154"
sgp4 = { version = "2.4", features = ["serde"] }
sha1 = "0.11"
shapefile = { version = "0.9.0", features = ["encoding_rs"] }
skrifa = "0.50.0"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
unicode-width = "0.2.2"

[[bin]]
name = "mapterm"
path = "src/bin/mapterm.rs"

[profile.dev.package."*"]
opt-level = 3

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
