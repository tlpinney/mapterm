[package]
name = "mapterm"
version = "0.1.2"
edition = "2024"
# The oldest Rust that builds it (the uuid dependency needs 1.89; mapterm itself 1.88).
rust-version = "1.89"
description = "A map in your terminal: vector tiles, MapLibre styles, imagery and your own data, as a ratatui widget and the mapterm viewer"
license = "MIT"
authors = ["Travis Pinney <travis.pinney@gmail.com>"]
repository = "https://github.com/tlpinney/mapterm"
homepage = "https://mapterm.com"
documentation = "https://docs.rs/mapterm"
readme = "README.md"
keywords = ["map", "terminal", "tui", "ratatui", "maplibre"]
categories = ["command-line-utilities", "science::geo", "visualization"]
# Kept out of the package: CI and release tooling, and the integration tests with their
# fixtures (they live in the repository).
exclude = [".github/", "tests/", "deny.toml", "about.toml", "about.hbs", "release/", "signing/", "fuzz/", "assets/"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.1"
arrow-cast = { version = "59.3", default-features = false }
arrow-schema = "59.3"
bytes = "1.12"
crossterm = "0.29.0"
flate2 = "1.1.10"
futures = "0.3"
geo-traits = "0.3"
geo-types = "0.7"
geoarrow-array = "0.9"
geoparquet = { version = "0.9", features = ["async"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp"] }
parquet = { version = "59.3", default-features = false, features = ["arrow", "async", "snap", "zstd"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = "1.0.154"
shapefile = { version = "0.9.0", features = ["encoding_rs"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"

[[bin]]
name = "mapterm"
path = "src/bin/mapterm.rs"

[profile.dev.package."*"]
opt-level = 3

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
