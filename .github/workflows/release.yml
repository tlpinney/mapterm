name: Release

# Builds release binaries for a version tag and attaches them to its GitHub release as a
# draft. The maintainer then signs SHA256SUMS locally and publishes it with
# release/sign-release.sh; CI never holds the signing key. The crate goes to crates.io
# only after the maintainer approves the crates-io environment, using trusted publishing
# (a short-lived token from GitHub's OIDC identity; no crates.io token is stored).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag to build, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - id: version
        name: The tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # macOS is built by build-macos below. Linux builds on Ubuntu 22.04: a binary needs
        # the glibc of the machine that built it, and 22.04's (2.35) runs on Ubuntu 22.04,
        # Debian 12, RHEL 10 and newer. ubuntu-latest's would shut out most installed systems.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin mapterm --target ${{ matrix.target }}
      - name: Third-party notices
        # The binary bundles its dependencies, whose licenses (MIT, BSD, Apache...) ask
        # for their copyright notices to ship with it.
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo about generate --fail about.hbs -o THIRD_PARTY_LICENSES.txt
      - name: Package
        run: |
          name="mapterm-${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mapterm" README.md LICENSE CHANGELOG.md THIRD_PARTY_LICENSES.txt "$name/"
          # The bundled JetBrains Mono's license goes with it (SIL OFL 1.1).
          cp fonts/OFL.txt "$name/JetBrainsMono-OFL.txt"
          tar czf "$name.tar.gz" "$name"
          "$name/mapterm" --help | head -1
          # The newest glibc it needs: what the release notes and install script promise.
          need="$(objdump -T "$name/mapterm" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)"
          echo "needs $need"
          [ "$need" = GLIBC_2.35 ] || [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] \
            || { echo "::error::the binary needs $need, newer than the 2.35 the docs promise"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: mapterm-*.tar.gz
          if-no-files-found: error

  build-macos:
    # One universal binary (Apple silicon and Intel), unsigned: release/sign-release.sh signs
    # it with the maintainer's Developer ID and notarizes it locally, so CI never holds the
    # Apple certificate or credentials.
    name: Build universal-apple-darwin
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --release --locked --bin mapterm --target aarch64-apple-darwin
          cargo build --release --locked --bin mapterm --target x86_64-apple-darwin
      - name: Third-party notices
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo about generate --fail about.hbs -o THIRD_PARTY_LICENSES.txt
      - name: Package
        run: |
          name="mapterm-${{ needs.check.outputs.version }}-universal-apple-darwin"
          mkdir "$name"
          lipo -create -output "$name/mapterm" \
            target/aarch64-apple-darwin/release/mapterm target/x86_64-apple-darwin/release/mapterm
          lipo -archs "$name/mapterm"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_LICENSES.txt "$name/"
          cp fonts/OFL.txt "$name/JetBrainsMono-OFL.txt"
          COPYFILE_DISABLE=1 tar czf "$name.tar.gz" "$name"
          "$name/mapterm" --help | head -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universal-apple-darwin
          path: mapterm-*.tar.gz
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [check, build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum mapterm-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh release/notes.sh "$TAG" > notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An existing release goes back to draft until it is signed again.
            gh release edit "$TAG" --draft=true --notes-file notes.md
            gh release delete-asset "$TAG" SHA256SUMS.sig --yes 2>/dev/null || true
          else
            gh release create "$TAG" --verify-tag --draft $pre --title "mapterm ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/mapterm-*.tar.gz dist/SHA256SUMS --clobber
          echo "Drafted $TAG; sign and publish it with: release/sign-release.sh $TAG"

  publish:
    name: Publish to crates.io
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment: the job waits for the maintainer's approval.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
