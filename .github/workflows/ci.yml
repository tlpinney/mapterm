name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the network smoke tests (OpenFreeMap, Photon, flatgeobuf.org), a check of every
  # live data provider the layers use (tests/providers.rs), the performance tests, and new
  # security advisories for unchanged dependencies.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# The token only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit hashes (the version is in the comment), so a moved or
# compromised tag can't change what runs.
jobs:
  test:
    name: Test, lint and docs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets --locked
      - name: Tests (offline)
        run: cargo test --all-targets --locked
      - name: Doc tests
        run: cargo test --doc --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  osv:
    # OSV.dev (RustSec, GitHub advisories and more) over every lockfile, including fuzz/;
    # cargo-deny above reads RustSec for the main one. Ignores are in osv-scanner.toml.
    name: Vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --recursive
            ./

  network:
    name: Network smoke tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Live services
        run: cargo test --locked --test network -- --ignored
      # Each provider once, through mapterm's own reader: a moved endpoint or a renamed field
      # fails the test named after the provider. Runs even if the step above failed.
      - name: Data providers
        if: ${{ !cancelled() }}
        run: cargo test --locked --test providers -- --ignored

  perf:
    name: Performance tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf
      # Pans and zooms over pinned tiles, live layers under load, and the viewer itself on a
      # pseudo-terminal (script(1)); bytes are checked strictly, times against this
      # platform's baseline in tests/perf-baseline.json. The tables go to the run summary.
      - name: Pans, zooms and live layers
        run: cargo test --locked --release --test perf -- --ignored --test-threads=1
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: target/perf-results.json
          if-no-files-found: ignore
